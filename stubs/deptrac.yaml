deptrac:
  paths:
    - ./app
    - ./Modules
  ignore_uncovered_internal_classes: true
  layers:
    -
      name: App
      collectors:
        -
          type: classLike
          value: .*App\\.*
    -
      name: Infrastructure
      collectors:
        -
          type: classLike
          value: .*Modules\\[^\\]+\\Infrastructure\\.*
    -
      name: Application
      collectors:
        -
          type: classLike
          value: .*Modules\\[^\\]+\\Application\\.*
    -
      name: Domain
      collectors:
        -
          type: classLike
          value: .*Modules\\(?!Shared\\)[^\\]+\\Domain\\.*
    -
      name: Shared
      collectors:
        -
          type: classLike
          value: .*Modules\\Shared\\.*
    -
      name: Illuminate
      collectors:
        -
          type: classLike
          value: .*Illuminate\\(?!Support).*
    -
      name: IlluminateSupportFacade
      collectors:
        -
          type: classLike
          value: .*Illuminate\\Support\\Facades\\.*
    -
      name: IlluminateSupport
      collectors:
        -
          type: classLike
          value: .*Illuminate\\Support\\(?!Facades).*
    -
      name: Carbon
      collectors:
        -
          type: classLike
          value: .*Carbon\\.*
  ruleset:
    App:
      - Infrastructure
      - Application
      - Domain
      - Shared
      - Illuminate
      - IlluminateSupportFacade
      - IlluminateSupport
      - Carbon
    Infrastructure:
      - Application
      - Domain
      - Shared
      - Illuminate
      - IlluminateSupportFacade
      - IlluminateSupport
      - Carbon
    Application:
      - Domain
      - Shared
      - IlluminateSupport
      - Carbon
    Domain:
      - Shared
      - IlluminateSupport
      - Carbon
    Shared:
      - Shared
