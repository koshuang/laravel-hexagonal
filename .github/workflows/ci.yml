name: Package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality and test suite
        run: composer lint

  integration:
    name: Laravel 13 integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Create clean Laravel application
        run: composer create-project laravel/laravel:^13.0 /tmp/laravel-hexagonal-integration --no-interaction --no-progress --prefer-dist

      - name: Install package from current checkout
        working-directory: /tmp/laravel-hexagonal-integration
        run: |
          composer config repositories.hexagonal path "$GITHUB_WORKSPACE"
          composer require koshuang/laravel-hexagonal:dev-main --no-interaction --no-progress --prefer-dist

      - name: Publish architecture stubs
        working-directory: /tmp/laravel-hexagonal-integration
        run: |
          php artisan vendor:publish --tag=hexagonal-stubs --force --no-interaction
          test -f stubs/hexagonal/module/module-service-provider.php.stub
          test -f stubs/hexagonal/shared/Domain/Contracts/Identity.php
          test -f stubs/hexagonal/deptrac.yaml

      - name: Install architecture scaffolding from published stubs
        working-directory: /tmp/laravel-hexagonal-integration
        run: |
          php artisan hexagonal:install
          test -f config/hexagonal.php
          test -f Modules/Shared/Domain/Contracts/Identity.php
          test -f deptrac.yaml
          php -r '$composer = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); if (($composer["autoload"]["psr-4"]["Modules\\"] ?? null) !== "Modules/") { exit(1); }'

      - name: Install architecture validation tools
        working-directory: /tmp/laravel-hexagonal-integration
        run: composer update nwidart/laravel-modules deptrac/deptrac --no-interaction --no-progress --prefer-dist

      - name: Generate and validate a module
        working-directory: /tmp/laravel-hexagonal-integration
        run: |
          mkdir -p /tmp/laravel-hexagonal-custom-stubs
          cp -R stubs/hexagonal/module/. /tmp/laravel-hexagonal-custom-stubs/
          printf '\n// Custom stub integration assertion.\n' >> /tmp/laravel-hexagonal-custom-stubs/module-service-provider.php.stub
          php artisan hexagonal:make-module Order
          php artisan hexagonal:make-module Custom --stub-path=/tmp/laravel-hexagonal-custom-stubs
          grep -q 'Custom stub integration assertion' Modules/Custom/Infrastructure/Providers/CustomServiceProvider.php
          php artisan hexagonal:validate
