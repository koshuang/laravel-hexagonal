name: Package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality and test suite
        run: composer lint

  integration:
    name: Laravel 13 integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Create clean Laravel application
        run: composer create-project laravel/laravel:^13.0 /tmp/laravel-hexagonal-integration --no-interaction --no-progress --prefer-dist

      - name: Install package from current checkout
        working-directory: /tmp/laravel-hexagonal-integration
        run: |
          composer config repositories.hexagonal path "$GITHUB_WORKSPACE"
          composer require koshuang/laravel-hexagonal:dev-main --no-interaction --no-progress --prefer-dist

      - name: Publish architecture stubs
        working-directory: /tmp/laravel-hexagonal-integration
        run: |
          php artisan vendor:publish --tag=hexagonal-stubs --force --no-interaction
          test -f stubs/hexagonal/module/module-service-provider.php.stub
          test -f stubs/hexagonal/shared/Domain/Contracts/Identity.php
          test -f stubs/hexagonal/deptrac.yaml

      - name: Install architecture scaffolding from published stubs
        working-directory: /tmp/laravel-hexagonal-integration
        run: |
          php artisan hexagonal:install
          test -f config/hexagonal.php
          test -f Modules/Shared/Domain/Contracts/Identity.php
          test -f deptrac.yaml
          php -r '$composer = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); if (($composer["autoload"]["psr-4"]["Modules\\"] ?? null) !== "Modules/") { exit(1); }'
          # Generated deptrac covers ./app and ./Modules and keeps allowances.
          grep -q -- '- ./app' deptrac.yaml
          grep -q -- '- ./Modules' deptrac.yaml
          grep -q 'name: Carbon' deptrac.yaml
          grep -q 'name: IlluminateSupportFacade' deptrac.yaml

      - name: Verify generated deptrac honours configurable allowances
        working-directory: /tmp/laravel-hexagonal-integration
        run: |
          # Default install keeps Carbon; re-running install --force reads the
          # allowances from the published config and renders deptrac accordingly.
          sed -i "s/'carbon' => true,/'carbon' => false,/" config/hexagonal.php
          php artisan hexagonal:install --force
          if grep -q 'name: Carbon' deptrac.yaml; then exit 1; fi
          if grep -q -- '- Carbon' deptrac.yaml; then exit 1; fi
          grep -q -- '- ./app' deptrac.yaml
          grep -q -- '- ./Modules' deptrac.yaml
          grep -q 'name: IlluminateSupportFacade' deptrac.yaml

      - name: Install architecture validation tools
        working-directory: /tmp/laravel-hexagonal-integration
        run: composer update nwidart/laravel-modules deptrac/deptrac --no-interaction --no-progress --prefer-dist

      - name: Generate and validate a module
        working-directory: /tmp/laravel-hexagonal-integration
        run: |
          mkdir -p /tmp/laravel-hexagonal-custom-stubs
          cp -R stubs/hexagonal/module/. /tmp/laravel-hexagonal-custom-stubs/
          printf '\n// Custom stub integration assertion.\n' >> /tmp/laravel-hexagonal-custom-stubs/module-service-provider.php.stub
          php artisan hexagonal:make-module Order
          php artisan hexagonal:make-module Custom --stub-path=/tmp/laravel-hexagonal-custom-stubs
          grep -q 'Custom stub integration assertion' Modules/Custom/Infrastructure/Providers/CustomServiceProvider.php
          php artisan hexagonal:validate

      - name: Verify make-module statuses registration
        working-directory: /tmp/laravel-hexagonal-integration
        run: |
          # A fresh module is enabled in modules_statuses.json.
          php artisan hexagonal:make-module Cart
          grep -q '"Cart": true' modules_statuses.json
          # Unknown pre-existing entries are preserved.
          php -r '$s = json_decode(file_get_contents("modules_statuses.json"), true); $s["External"] = false; file_put_contents("modules_statuses.json", json_encode($s, JSON_PRETTY_PRINT));'
          php artisan hexagonal:make-module Invoice
          grep -q '"External": false' modules_statuses.json
          grep -q '"Invoice": true' modules_statuses.json
          # --no-active registers the module as disabled.
          php artisan hexagonal:make-module Deferred --no-active
          grep -q '"Deferred": false' modules_statuses.json
          # Duplicate module name without --force is rejected.
          if php artisan hexagonal:make-module Cart; then exit 1; fi
